<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 464" width="600" height="464" role="img" aria-label="Bar chart: 41% of students in low-poverty schools versus 24% in high-poverty schools were taught by a teacher who exceeded expected growth"><title>Bar chart: 41% of students in low-poverty schools versus 24% in high-poverty schools were taught by a teacher who exceeded expected growth</title><rect width="600" height="464" fill="#fff"/><text x="30" y="40" font-family="Mulish, Arial" font-size="19" font-weight="700" fill="#263B6A">Students taught by a teacher who exceeded</text><text x="30" y="64" font-family="Mulish, Arial" font-size="19" font-weight="700" fill="#263B6A">expected growth the prior year (BCS, illustrative)</text><line x1="60" y1="400" x2="560" y2="400" stroke="#999"/><rect x="120" y="133.5" width="140" height="266.5" fill="#5E9A78"/><text x="190" y="125.5" font-family="Mulish, Arial" font-size="24" font-weight="700" text-anchor="middle" fill="#2E2E38">41%</text><text x="190" y="428" font-family="Mulish, Arial" font-size="15" text-anchor="middle" fill="#2E2E38">Low-poverty schools</text><rect x="340" y="244.0" width="140" height="156.0" fill="#CC5F3A"/><text x="410" y="236.0" font-family="Mulish, Arial" font-size="24" font-weight="700" text-anchor="middle" fill="#2E2E38">24%</text><text x="410" y="428" font-family="Mulish, Arial" font-size="15" text-anchor="middle" fill="#2E2E38">High-poverty schools</text></svg>